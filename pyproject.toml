[project]
name = "intakedesk"
version = "0.1.0"
description = "An intake agent: messy requests in, validated records out, nothing written without a human approval."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Elizabeth Fulgham" }]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intakedesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: evaluation runs against recorded model fixtures"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
per-file-ignores = { "tests/*" = ["S101"] }
